<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행 계획 도우미</title>
<style>
  :root {
    --bg: #fff7ef; --surface: #ffffff; --text: #1f2a44; --muted: #7b8196;
    --line: #f1e4d6; --accent: #0ea5a4; --accent-2: #ff7a59; --accent-soft: #dff7f5;
    --sun: #ffb84d; --warn: #e2570f; --done: #14a06f; --radius: 18px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1424; --surface: #17213a; --text: #f2f5ff; --muted: #97a3c2;
      --line: #273456; --accent: #2dd4bf; --accent-2: #ff8a6b; --accent-soft: #15322f;
      --sun: #ffc45e; --warn: #fdba74; --done: #4ade80; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1424; --surface: #17213a; --text: #f2f5ff; --muted: #97a3c2;
    --line: #273456; --accent: #2dd4bf; --accent-2: #ff8a6b; --accent-soft: #15322f;
    --sun: #ffc45e; --warn: #fdba74; --done: #4ade80; color-scheme: dark;
  }
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html { scrollbar-gutter: stable; }
  html, body { overflow-x: hidden; max-width: 100%; }
  body {
    margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .hero {
    position: relative; overflow: hidden;
    background: linear-gradient(120deg, #0ea5e9 0%, #14b8a6 45%, #ff8a5b 100%);
    color: #fff; padding: 24px 22px 30px; border-radius: 0 0 28px 28px;
    box-shadow: 0 10px 30px rgba(14, 165, 233, .25);
  }
  .hero::after {
    content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(255,255,255,.35), rgba(255,255,255,0) 70%); border-radius: 50%;
  }
  .hero small { opacity: .92; font-size: 13px; letter-spacing: .02em; }
  .hero h1 { font-size: 24px; margin: 4px 0 0; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,.12); }
  main { padding: 18px 16px 110px; max-width: 720px; margin: 0 auto; }
  h2 { font-size: 16px; margin: 0 0 10px; font-weight: 800; }
  h3 { font-size: 15px; margin: 0; font-weight: 800; }

  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; justify-content: space-around; gap: 4px;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -8px 24px rgba(255, 122, 89, .12);
  }
  nav button {
    flex: 1; border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 12px; padding: 6px 2px; border-radius: 14px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px; transition: all .15s;
  }
  nav button .ico { font-size: 21px; line-height: 1; }
  nav button.active {
    color: #fff; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), #0ea5e9);
    box-shadow: 0 6px 16px rgba(14, 165, 233, .35);
  }

  .card {
    background: var(--surface); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px; border: 1px solid var(--line);
    box-shadow: 0 6px 18px rgba(31, 42, 68, .05);
  }
  .card h2 { color: var(--text); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  .row > * { min-width: 0; }

  input, select {
    font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--bg); color: var(--text); outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type="text"] { flex: 1; min-width: 120px; }
  input.num { width: 110px; text-align: right; }
  input.time { width: 138px; min-width: 138px; }

  button {
    font: inherit; font-size: 14px; padding: 10px 14px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--surface); color: var(--text); cursor: pointer;
  }
  button.primary {
    background: linear-gradient(135deg, var(--accent-2), #ff5e7e); color: #fff; border: 0;
    font-weight: 800; box-shadow: 0 6px 14px rgba(255, 94, 126, .3);
  }
  button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.small { padding: 4px 10px; font-size: 12px; color: var(--accent-2); border-radius: 999px; border-color: transparent; background: rgba(255,122,89,.1); }

  .muted { color: var(--muted); font-size: 13px; }
  .warn { color: var(--warn); font-size: 13px; font-weight: 700; }
  .done { text-decoration: line-through; color: var(--muted); }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .summary div {
    border-radius: var(--radius); padding: 14px; font-size: 13px; color: rgba(255,255,255,.9);
    background: linear-gradient(135deg, #0ea5e9, #14b8a6); box-shadow: 0 8px 20px rgba(14,165,233,.25);
  }
  .summary div:nth-child(2) { background: linear-gradient(135deg, #ff8a5b, #ff5e7e); box-shadow: 0 8px 20px rgba(255,94,126,.25); }
  .summary div:nth-child(3) { background: linear-gradient(135deg, #facc15, #ffb84d); color: #3b2a00; box-shadow: 0 8px 20px rgba(255,184,77,.3); }
  .summary b { display: block; font-size: 20px; margin-top: 4px; color: inherit; }

  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 10px 4px; border-bottom: 1px solid var(--line); text-align: left; font-size: 14px; }
  td.r, th.r { text-align: right; }

  .tag {
    display: inline-block; font-size: 12px; padding: 4px 11px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); text-decoration: none; font-weight: 700;
  }

  /* 일정 타임라인 */
  .daybox h3 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .daybox h3 span:first-child {
    background: linear-gradient(135deg, #ff8a5b, #ff5e7e); color: #fff;
    padding: 4px 12px; border-radius: 999px; font-size: 14px;
  }
  .daybox h3 .muted { font-weight: 800; color: var(--accent); }
  img.emoji { height: 1.15em; width: 1.15em; margin: 0 .05em; vertical-align: -0.2em; }
  .flag { font-size: 1.1em; }
  .timeline .row { padding: 10px 0; border-bottom: 1px dashed var(--line); margin: 0; }
  .timeline .row:last-of-type { border-bottom: 0; }
  .timeline b { color: var(--accent-2); }
  .add-line { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }

  /* ---- 꾸밈 ---- */
  body {

  }
  .hero::before {
    content: ""; position: absolute; left: -30px; bottom: -50px; width: 140px; height: 140px;
    background: radial-gradient(circle, rgba(255,255,255,.28), rgba(255,255,255,0) 70%); border-radius: 50%;
  }
  .hero h1 { position: relative; }
  .hero-wave { position: absolute; left: 0; bottom: 0; width: 100%; height: 46px; pointer-events: none; }
  .watermark { position: absolute; right: 16px; top: 12px; font-size: 92px; opacity: .25; transform: rotate(10deg); pointer-events: none; line-height: 1; }
  .card h3 { display: flex; align-items: center; gap: 6px; }
  .hero small { position: relative; display: block; }
  .card {
    transition: box-shadow .18s ease;
  }
  .card:hover { box-shadow: 0 12px 26px rgba(31,42,68,.10); }
  button { transition: filter .12s ease; }
  button:hover { filter: brightness(1.05); }
  nav button { transition: background .15s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .progress { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 10px; }
  .progress > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #0ea5e9, #14b8a6); }
  .empty { text-align: center; padding: 26px 10px; color: var(--muted); }
  .empty .big { font-size: 40px; display: block; margin-bottom: 6px; }
  .section-title { display: flex; align-items: center; gap: 8px; margin: 4px 2px 10px; font-size: 15px; font-weight: 800; }
  .section-title::before { content: ""; width: 4px; height: 16px; border-radius: 4px; background: linear-gradient(180deg, var(--accent), var(--accent-2)); }

  /* ---- 효과 ---- */
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  #fx span { position: absolute; top: -40px; opacity: .22; animation: drift linear infinite; }
  main { position: relative; z-index: 1; }
  @keyframes drift {
    from { transform: translateY(0) rotate(0deg); }
    to { transform: translateY(115vh) rotate(360deg); }
  }
  input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
  @keyframes pop {
    0% { transform: scale(.7); }
    60% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .confetti span {
    position: absolute; top: -40px; font-size: 22px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    from { transform: translateY(0) rotate(0deg); opacity: 1; }
    to { transform: translateY(110vh) rotate(720deg); opacity: .2; }
  }
</style>
</head>
<body>
<header class="hero" id="hero"></header>
<nav>
    <button data-tab="pack" class="active"><span class="ico">🎒</span>짐</button>
    <button data-tab="prep"><span class="ico">✅</span>준비물</button>
    <button data-tab="flight"><span class="ico">✈️</span>항공</button>
    <button data-tab="cost"><span class="ico">💳</span>비용</button>
    <button data-tab="plan"><span class="ico">🗓️</span>일정</button>
    <button data-tab="photo"><span class="ico">📸</span>사진</button>
  </nav>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
<script>
(function () {
  // ---------- 상태 (메모리에만 존재, 새로고침하면 초기화) ----------
  var uid = 0;
  function id() { uid += 1; return "i" + uid; }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function addDays(s, n) {
    var p = s.split("-");
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
    return d.toISOString().slice(0, 10);
  }

  var TEMPLATE = {
    tab: "pack",
    trip: { dest: "", currency: "엔(JPY)", depart: "2026-12-05", ret: "2026-12-07", names: ["나"], budget: null, rate: null, unit: 1 },
    pack: [
      { id: id(), name: "여권", essential: true, done: false },
      { id: id(), name: "신용카드 / 체크카드", essential: true, done: false },
      { id: id(), name: "현지 통화 현금", essential: true, done: false },
      { id: id(), name: "휴대폰 + 충전기", essential: true, done: false },
      { id: id(), name: "변환 어댑터", essential: true, done: false },
      { id: id(), name: "속옷 / 양말", essential: true, done: false },
      { id: id(), name: "편한 신발", essential: true, done: false },
      { id: id(), name: "세면도구", essential: true, done: false },
      { id: id(), name: "상비약", essential: true, done: false }
    ],
    prep: [
      { id: id(), name: "여권 유효기간 확인 (6개월 이상)", done: false, link: "" },
      { id: id(), name: "비자 / 입국 허가 확인", done: false, link: "" },
      { id: id(), name: "여행자 보험 가입", done: false, link: "" },
      { id: id(), name: "항공권 예약 확인", done: false, link: "" },
      { id: id(), name: "숙소 예약 확인", done: false, link: "" },
      { id: id(), name: "환전", done: false, link: "" },
      { id: id(), name: "해외 결제 카드 확인", done: false, link: "" },
      { id: id(), name: "데이터 준비 (로밍 또는 eSIM)", done: false, link: "" }
    ],
    flights: [], // { id, direction, airline, number, depAirport, depTime, arrAirport, arrTime, code, link }
    costs: [],   // { id, name, date, category, amount }
    plan: []     // { id, date, start, end, place, amount }
  };

  var app = { trips: [] };
  var state = null;

  function makeTrip(name, depart, ret) {
    var t = JSON.parse(JSON.stringify(TEMPLATE));
    t.trip.dest = name;
    t.trip.depart = depart;
    t.trip.ret = ret;
    t.photos = [];
    t.tab = "pack";
    return t;
  }

  var THEMES = [
    { k: ["일본", "도쿄", "오사카", "교토", "후쿠오카", "오키나와", "japan"], e: "🇯🇵", f: "JP", a: "#e11d48", b: "#fb7185" },
    { k: ["한국", "서울", "부산", "제주", "korea"], e: "🇰🇷", f: "KR", a: "#2563eb", b: "#60a5fa" },
    { k: ["태국", "방콕", "푸켓", "thailand"], e: "🇹🇭", f: "TH", a: "#d97706", b: "#fbbf24" },
    { k: ["베트남", "다낭", "하노이", "호치민", "vietnam"], e: "🇻🇳", f: "VN", a: "#059669", b: "#34d399" },
    { k: ["프랑스", "파리", "france"], e: "🇫🇷", f: "FR", a: "#4f46e5", b: "#a78bfa" },
    { k: ["이탈리아", "로마", "밀라노", "피렌체", "italy"], e: "🇮🇹", f: "IT", a: "#15803d", b: "#f59e0b" },
    { k: ["미국", "뉴욕", "하와이", "la", "usa"], e: "🇺🇸", f: "US", a: "#1d4ed8", b: "#ef4444" },
    { k: ["대만", "타이베이", "taiwan"], e: "🇹🇼", f: "TW", a: "#0d9488", b: "#2dd4bf" },
    { k: ["중국", "베이징", "상하이", "china"], e: "🇨🇳", f: "CN", a: "#dc2626", b: "#f59e0b" },
    { k: ["스페인", "바르셀로나", "마드리드", "spain"], e: "🇪🇸", f: "ES", a: "#ea580c", b: "#facc15" }
  ];

  var FLAGS = {
    JP: '<rect width="24" height="15" fill="#fff"/><circle cx="12" cy="7.5" r="4.5" fill="#bc002d"/>',
    KR: (function () {
      var bar = function (x, y, broken) {
        var o = [0, 2.2, 4.4], out = "";
        o.forEach(function (d) {
          if (broken) {
            out += '<rect x="' + x + '" y="' + (y + d) + '" width="2.1" height="0.8" fill="#000"/>' +
                   '<rect x="' + (x + 3.1) + '" y="' + (y + d) + '" width="2.1" height="0.8" fill="#000"/>';
          } else {
            out += '<rect x="' + x + '" y="' + (y + d) + '" width="5.2" height="0.8" fill="#000"/>';
          }
        });
        return out;
      };
      var pattern = function (x, y, a, b, c) {
        var o = [0, 2.2, 4.4], out = "";
        [a, b, c].forEach(function (broken, i) {
          var yy = y + o[i];
          if (broken) {
            out += '<rect x="' + x + '" y="' + yy + '" width="2.1" height="0.8" fill="#000"/>' +
                   '<rect x="' + (x + 3.1) + '" y="' + yy + '" width="2.1" height="0.8" fill="#000"/>';
          } else {
            out += '<rect x="' + x + '" y="' + yy + '" width="5.2" height="0.8" fill="#000"/>';
          }
        });
        return out;
      };
      return '<rect width="27" height="18" fill="#fff"/>' +
        '<path d="M9 9 A4.5 4.5 0 0 1 18 9 Z" fill="#cd2e3a"/>' +
        '<path d="M9 9 A4.5 4.5 0 0 0 18 9 Z" fill="#0047a0"/>' +
        pattern(1.8, 1.6, false, false, false) +   // 건 (좌상)
        pattern(20.0, 1.6, true, false, true) +    // 감 (우상)
        pattern(1.8, 11.2, false, true, false) +   // 리 (좌하)
        pattern(20.0, 11.2, true, true, true);     // 곤 (우하)
    })(),
    TH: '<rect width="24" height="2.5" fill="#a51931"/><rect y="2.5" width="24" height="2.5" fill="#fff"/><rect y="5" width="24" height="5" fill="#2d2a4a"/><rect y="10" width="24" height="2.5" fill="#fff"/><rect y="12.5" width="24" height="2.5" fill="#a51931"/>',
    VN: '<rect width="24" height="15" fill="#da251d"/><polygon fill="#ffcd00" points="12,3.2 13.1,6.4 16.4,6.4 13.7,8.4 14.7,11.6 12,9.6 9.3,11.6 10.3,8.4 7.6,6.4 10.9,6.4"/>',
    FR: '<rect width="8" height="15" fill="#002395"/><rect x="8" width="8" height="15" fill="#fff"/><rect x="16" width="8" height="15" fill="#ed2939"/>',
    IT: '<rect width="8" height="15" fill="#009246"/><rect x="8" width="8" height="15" fill="#fff"/><rect x="16" width="8" height="15" fill="#ce2b37"/>',
    US: '<rect width="24" height="15" fill="#fff"/><rect width="24" height="1.15" fill="#b22234"/><rect y="2.3" width="24" height="1.15" fill="#b22234"/><rect y="4.6" width="24" height="1.15" fill="#b22234"/><rect y="6.9" width="24" height="1.15" fill="#b22234"/><rect y="9.2" width="24" height="1.15" fill="#b22234"/><rect y="11.5" width="24" height="1.15" fill="#b22234"/><rect y="13.8" width="24" height="1.15" fill="#b22234"/><rect width="10" height="8.1" fill="#3c3b6e"/>',
    TW: '<rect width="24" height="15" fill="#fe0000"/><rect width="10" height="8.4" fill="#000095"/><circle cx="5" cy="4.2" r="2.4" fill="#fff"/>',
    CN: '<rect width="24" height="15" fill="#de2910"/><polygon fill="#ffde00" transform="translate(-1.5,0.25) scale(0.5)" points="12,3.2 13.1,6.4 16.4,6.4 13.7,8.4 14.7,11.6 12,9.6 9.3,11.6 10.3,8.4 7.6,6.4 10.9,6.4"/>',
    ES: '<rect width="24" height="15" fill="#aa151b"/><rect y="3.75" width="24" height="7.5" fill="#f1bf00"/>'
  };

  function flagHtml(th) {
    return '<span class="flag">' + th.e + '</span>';
    if (!th.f || !FLAGS[th.f]) return th.e;
    var big = th.f === "KR";
    var w = big ? 27 : 24, h = big ? 18 : 15;
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" style="border-radius:3px;vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,.15)">' + FLAGS[th.f] + '</svg>';
  }

  var DEFAULT_THEME = { e: "✈️", a: "#0ea5a4", b: "#ff8a5b" };

  function themeOf(name) {
    var n = (name || "").toLowerCase();
    for (var i = 0; i < THEMES.length; i++) {
      for (var j = 0; j < THEMES[i].k.length; j++) {
        if (n.indexOf(THEMES[i].k[j].toLowerCase()) !== -1) return THEMES[i];
      }
    }
    return DEFAULT_THEME;
  }

  function periodOf(tr) {
    var a = tr.trip.depart, b = tr.trip.ret;
    if (!a || !b) return "";
    var p1 = a.split("-"), p2 = b.split("-");
    var d1 = Date.UTC(+p1[0], +p1[1] - 1, +p1[2]);
    var d2 = Date.UTC(+p2[0], +p2[1] - 1, +p2[2]);
    var nights = Math.round((d2 - d1) / 86400000);
    if (nights < 0) return "";
    return (+p1[1]) + "월 " + (+p1[2]) + "일 ~ " + (+p2[1]) + "월 " + (+p2[2]) + "일 (" + nights + "박 " + (nights + 1) + "일)";
  }

  function readImage(file, cb) {
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 900;
        var sc = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * sc);
        c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL("image/jpeg", 0.8));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }

  var CATEGORIES = ["교통", "숙소", "식비", "입장료", "쇼핑", "기타"];
  var costSort = false;
  var lastCat = "교통";
  var lastPayer = "";
  var CURRENCIES = ["엔(JPY)", "달러(USD)", "유로(EUR)", "위안(CNY)", "파운드(GBP)", "호주달러(AUD)", "바트(THB)", "동(VND)"];

  function tripDates() {
    var out = [];
    if (!state.trip.depart || !state.trip.ret || state.trip.ret < state.trip.depart) return out;
    var d = state.trip.depart, guard = 0;
    while (d <= state.trip.ret && guard < 60) { out.push(d); d = addDays(d, 1); guard++; }
    return out;
  }

  function fmt(n) { return n == null ? "-" : Math.round(n).toLocaleString("ko-KR"); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  }); }

  // ---------- 탭 렌더 ----------
  function renderPack() {
    var list = state.pack;
    var left = list.filter(function (x) { return !x.done; }).length;
    var doneCount = list.length - left;
    var html = '<div class="summary">' +
      '<div style="background:var(--surface);color:var(--muted);border:1px solid var(--line);box-shadow:none">🧳 남은 짐<b style="color:#dc2626">' + left + '개</b></div>' +
      '<div style="background:var(--surface);color:var(--muted);border:1px solid var(--line);box-shadow:none">✅ 챙긴 짐<b style="color:#2563eb">' + doneCount + '개</b></div></div>';
    var pct = list.length ? Math.round((doneCount / list.length) * 100) : 0;
    if (pct === 100 && !lastPackFull) confetti();
    lastPackFull = pct === 100;
    html += '<div class="card"><div class="muted">진행률 ' + pct + '%</div><div class="progress"><div style="width:' + pct + '%"></div></div></div>';
    html += '<div class="card">';
    list.forEach(function (x) {
      html += '<div class="row">' +
        '<input type="checkbox" data-act="toggle" data-list="pack" data-id="' + x.id + '"' + (x.done ? " checked" : "") + '>' +
        '<span class="' + (x.done ? "done" : "") + '" style="flex:1">' + iconFor(x.name) + ' ' + esc(x.name) + '</span>' +

        '<button class="small" data-act="del" data-list="pack" data-id="' + x.id + '">삭제</button></div>';
    });
    html += '</div>' +
      '<div class="row"><input type="text" id="newPack" placeholder="짐 추가 (예: 우산)">' +
      '<button class="primary" data-act="addPack">추가</button></div>';
    return html;
  }

  function tripPeriodText() {
    var a = state.trip.depart, b = state.trip.ret;
    if (!a || !b) return "날짜를 비용 탭에서 정해 주세요";
    var p1 = a.split("-"), p2 = b.split("-");
    var d1 = Date.UTC(+p1[0], +p1[1] - 1, +p1[2]);
    var d2 = Date.UTC(+p2[0], +p2[1] - 1, +p2[2]);
    var nights = Math.round((d2 - d1) / 86400000);
    if (nights < 0) return "귀국일을 확인해 주세요";
    return (+p1[1]) + "월 " + (+p1[2]) + "일 ~ " + (+p2[1]) + "월 " + (+p2[2]) + "일 (" + nights + "박 " + (nights + 1) + "일)";
  }

  function renderPrep() {
    var list = state.prep;
    var left = list.filter(function (x) { return !x.done; }).length;
    var pd = tripPeriodText();
    var html = '<div class="card" style="text-align:center"><div class="muted">여행 기간</div>' +
      '<h2 style="margin:6px 0 0;font-size:18px">' + pd + '</h2></div>' +
      '<div class="summary"><div>남은 준비물<b>' + left + '개</b></div></div><div class="card">';
    list.forEach(function (x) {
      html += '<div class="row">' +
        '<input type="checkbox" data-act="toggle" data-list="prep" data-id="' + x.id + '"' + (x.done ? " checked" : "") + '>' +
        '<span class="' + (x.done ? "done" : "") + '" style="flex:1">' + iconFor(x.name) + ' ' + esc(x.name) + '</span>' +
        (x.link ? '<a href="' + esc(x.link) + '" target="_blank" rel="noopener" class="tag">링크 열기</a>' : "") +
        '<button class="small" data-act="del" data-list="prep" data-id="' + x.id + '">삭제</button></div>';
    });
    html += '</div><div class="card"><div class="row"><input type="text" id="newPrep" placeholder="준비물 추가">' +
      '</div><div class="row"><input type="url" id="newPrepLink" placeholder="링크 (항공권·숙소 예약 페이지 주소, 선택)">' +
      '<button class="primary" data-act="addPrep">추가</button></div></div>';
    return html;
  }

  var PRESET = {
    "엔(JPY)": [100, 842.12], "달러(USD)": [1, 1342.50], "유로(EUR)": [1, 1469.37],
    "위안(CNY)": [1, 201.20], "파운드(GBP)": [1, 1757.53], "호주달러(AUD)": [1, 884.84]
  };

  function toKrw(amount) {
    var r = state.trip.rate;
    if (!r || isNaN(amount)) return null;
    return Math.round(amount * r / (state.trip.unit || 1));
  }

  function iconFor(name) {
    var n = (name || "").toLowerCase();
    var map = [
      ["여권", "🛂"], ["카드", "💳"], ["현금", "💴"], ["환전", "💱"], ["휴대폰", "📱"], ["충전", "🔌"],
      ["어댑터", "🔌"], ["속옷", "👕"], ["양말", "🧦"], ["신발", "👟"], ["세면", "🧴"], ["상비약", "💊"],
      ["보험", "🛡️"], ["비자", "📝"], ["항공", "✈️"], ["숙소", "🏨"], ["예약", "🎫"], ["데이터", "📶"],
      ["esim", "📶"], ["로밍", "📶"], ["옷", "👔"], ["우산", "☂️"], ["선글라스", "🕶️"], ["카메라", "📷"]
    ];
    for (var i = 0; i < map.length; i++) if (n.indexOf(map[i][0]) !== -1) return map[i][1];
    return "🧳";
  }

  function catIcon(cat) {
    var m = { "교통": "🚆", "숙소": "🏨", "식비": "🍜", "입장료": "🎫", "쇼핑": "🛍️", "기타": "🧾" };
    return m[cat] || "🧾";
  }

  var FLOAT_ICONS = ["✈️", "☁️", "🌴", "⭐", "🌊", "🎈", "🗺️", "🌸"];

  function initFx() {
    var fx = document.createElement("div");
    fx.id = "fx";
    for (var i = 0; i < 14; i++) {
      var sp = document.createElement("span");
      sp.textContent = FLOAT_ICONS[i % FLOAT_ICONS.length];
      sp.style.left = (Math.random() * 100) + "%";
      sp.style.fontSize = (14 + Math.random() * 22) + "px";
      sp.style.animationDuration = (16 + Math.random() * 18) + "s";
      sp.style.animationDelay = (-Math.random() * 30) + "s";
      fx.appendChild(sp);
    }
    document.body.insertBefore(fx, document.body.firstChild);
  }

  function confetti() {
    var box = document.createElement("div");
    box.className = "confetti";
    var icons = ["🎉", "✨", "🎊", "⭐", "💫"];
    for (var i = 0; i < 46; i++) {
      var sp = document.createElement("span");
      sp.textContent = icons[i % icons.length];
      sp.style.left = (Math.random() * 100) + "%";
      sp.style.animationDuration = (1.8 + Math.random() * 1.6) + "s";
      sp.style.animationDelay = (Math.random() * 0.6) + "s";
      box.appendChild(sp);
    }
    document.body.appendChild(box);
    setTimeout(function () { box.remove(); }, 3600);
  }

  var lastPackFull = false;

  function getNames() {
    return (state.trip.names || []).filter(function (n) { return n; });
  }

  function settlement(names, costs, total) {
    var n = names.length || 1;
    var share = total / n;
    var bal = {};
    names.forEach(function (nm) { bal[nm] = 0; });
    costs.forEach(function (c) {
      if (c.payer && bal[c.payer] !== undefined) bal[c.payer] += Number(c.amount) || 0;
    });
    names.forEach(function (nm) { bal[nm] -= share; });
    var debtors = [], creditors = [];
    names.forEach(function (nm) {
      if (bal[nm] < -0.5) debtors.push({ n: nm, v: -bal[nm] });
      else if (bal[nm] > 0.5) creditors.push({ n: nm, v: bal[nm] });
    });
    var lines = [];
    var i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      var x = Math.min(debtors[i].v, creditors[j].v);
      lines.push({ from: debtors[i].n, to: creditors[j].n, amt: Math.round(x) });
      debtors[i].v -= x; creditors[j].v -= x;
      if (debtors[i].v < 0.5) i++;
      if (creditors[j].v < 0.5) j++;
    }
    return lines;
  }

  function renderCost() {
    var t = state.trip;
    var cur = esc(t.currency || "");
    var names = getNames();
    var n = names.length || 1;
    var total = 0;
    state.costs.forEach(function (c) { total += Number(c.amount) || 0; });

    var html = '<div class="card">' +
      '<div class="row"><input type="text" id="dest" placeholder="목적지" value="' + esc(t.dest) + '"></div>' +
      '<div class="row"><span class="muted">출발</span><input type="date" id="depart" value="' + t.depart + '">' +
      '<button type="button" class="small" data-act="setToday" data-target="depart">오늘</button>' +
      '<span class="muted">귀국</span><input type="date" id="ret" value="' + t.ret + '">' +
      '<button type="button" class="small" data-act="setToday" data-target="ret">오늘</button></div>' +
      '<div class="row"><select id="currency">' + CURRENCIES.map(function (c) {
        return '<option' + (c === t.currency ? ' selected' : '') + '>' + c + '</option>';
      }).join("") + '</select>' +
      '<input type="text" id="names" placeholder="참여자 (쉼표로 구분, 예: 나,친구1,친구2)" value="' + esc(names.join(",")) + '">' +
      '</div>' +
      '<div class="row"><span class="muted">예산</span><input type="number" id="budget" class="num" placeholder="없음" value="' + (t.budget == null ? "" : t.budget) + '" style="width:140px"><span class="muted">' + cur + '</span></div>' +
      '<div class="row"><span class="muted">환율</span><input type="number" step="0.01" id="rate" class="num" placeholder="없음" value="' + (t.rate == null ? "" : t.rate) + '" style="width:110px">' +
      '<select id="unit"><option value="1"' + (t.unit === 1 ? " selected" : "") + '>1 단위당 원</option><option value="100"' + (t.unit === 100 ? " selected" : "") + '>100 단위당 원</option></select>' +
      '<button type="button" class="small" data-act="fillRates">은행 고시환율</button></div></div>';

    var remain = t.budget == null ? null : t.budget - total;
    var totalKrw = toKrw(total);
    html += '<div class="summary"><div>총 사용액<b>' + fmt(total) + ' ' + cur + '</b></div>' +
      (totalKrw == null ? '' : '<div>원화 환산<b>' + fmt(totalKrw) + ' 원</b></div>') +
      (remain == null ? '' : '<div>남은 예산<b class="' + (remain < 0 ? 'warn' : '') + '">' + fmt(remain) + ' ' + cur + '</b></div>') + '</div>';

    // 분류별 합계
    var cat = {};
    CATEGORIES.forEach(function (c) { cat[c] = 0; });
    state.costs.forEach(function (c) { cat[c.category || "기타"] = (cat[c.category || "기타"] || 0) + (Number(c.amount) || 0); });
    html += '<div class="card"><div class="section-title">분류별 합계</div><table>';
    Object.keys(cat).forEach(function (k) {
      if (!cat[k]) return;
      html += '<tr><td>' + esc(k) + '</td><td class="r">' + fmt(cat[k]) + ' ' + cur + '</td></tr>';
    });
    if (!total) html += '<tr><td class="muted">사용 내역이 없습니다.</td></tr>';
    html += '</table></div>';

    // 정산
    var lines = settlement(names, state.costs, total);
    html += '<div class="card"><h2 style="margin-top:0">정산</h2>';
    if (!state.costs.length) html += '<div class="muted">사용 내역을 추가하면 정산이 표시됩니다.</div>';
    else if (!lines.length) html += '<div class="muted">모두 똑같이 냈어요.</div>';
    lines.forEach(function (l) {
      html += '<div class="row"><span style="flex:1"><b>' + esc(l.from) + '</b> → <b>' + esc(l.to) + '</b></span><span>' + fmt(l.amt) + ' ' + cur + '</span></div>';
    });
    html += '</div>';

    // 사용 내역
    var list = state.costs.slice();
    if (costSort) list.sort(function (a, b) { return (Number(b.amount) || 0) - (Number(a.amount) || 0); });
    html += '<div class="card"><div class="row"><h2 style="margin:0;flex:1">사용 내역</h2>' +
      '<button class="small" data-act="toggleSort">' + (costSort ? "입력 순서로" : "금액 큰 순으로") + '</button></div>';
    if (!list.length) html += '<div class="muted">아직 사용 내역이 없습니다.</div>';
    list.forEach(function (c) {
      html += '<div class="row"><b style="min-width:52px;color:var(--accent-2)">' + (c.time || "--:--") + '</b><span style="flex:1">' + catIcon(c.category) + ' ' + esc(c.name) + ' <span class="muted">· ' + esc(c.category) + ' · ' + esc(c.payer || "") + ' 결제</span></span>' +
        '<span style="text-align:right">' + fmt(c.amount) + ' ' + cur + (toKrw(c.amount) == null ? '' : '<br><span class="muted">' + fmt(toKrw(c.amount)) + ' 원</span>') + '</span>' +
        '<button class="small" data-act="del" data-list="costs" data-id="' + c.id + '">삭제</button></div>';
    });
    html += '</div>';

    // 추가
    html += '<div class="card"><h2 style="margin-top:0">사용 내역 추가</h2><div class="row">' +
      timeWheel('cT') + '<input type="text" id="cN" placeholder="항목 (예: 점심)">' +
      '<input type="number" step="0.01" class="num" id="cA" placeholder="금액" style="width:110px">' +
      '</div><div class="row">' +
      '<select id="cC">' + CATEGORIES.map(function (c) { return "<option" + (c === lastCat ? " selected" : "") + ">" + c + "</option>"; }).join("") + '</select>' +
      '<select id="cP">' + names.map(function (nm) { return "<option" + (nm === lastPayer ? " selected" : "") + ">" + esc(nm) + "</option>"; }).join("") + '</select>' +
      '<button class="primary" data-act="addCost">추가</button></div>' +
      '<div class="row" style="margin-top:8px"><input type="text" id="newPerson" placeholder="사람 추가 (예: 친구2)">' +
      '<button data-act="addPerson">이름 추가</button></div></div>';
    return html;
  }

  function timeWheel(prefix) {
    var hs = '<option value="">--</option>';
    for (var h = 0; h < 24; h++) { var hh = (h < 10 ? "0" : "") + h; hs += '<option value="' + hh + '">' + hh + '시</option>'; }
    var ms = '<option value="">--</option>';
    for (var m = 0; m < 60; m += 1) { var mm = (m < 10 ? "0" : "") + m; ms += '<option value="' + mm + '">' + mm + '분</option>'; }
    return '<select id="' + prefix + 'H" class="time">' + hs + '</select>' +
      '<select id="' + prefix + 'M" class="time">' + ms + '</select>' +
      '<button type="button" class="small" data-act="setNow" data-p="' + prefix + '">지금</button>';
  }

  function readTime(prefix) {
    var h = document.getElementById(prefix + "H").value;
    var m = document.getElementById(prefix + "M").value;
    if (!h) return "";
    return h + ":" + (m || "00");
  }

  function renderPlan() {
    var dates = tripDates();
    var cur = esc(state.trip.currency || "");
    var html = '';
    if (!dates.length) return '<div class="warn">여행 날짜를 비용 탭에서 설정해 주세요.</div>';
    dates.forEach(function (d, idx) {
      var items = state.plan.filter(function (p) { return p.date === d; })
        .sort(function (a, b) { return (a.start || "").localeCompare(b.start || ""); });
      var daySum = 0;
      items.forEach(function (p) { daySum += Number(p.amount) || 0; });
      html += '<div class="card daybox timeline"><h3><span>Day ' + (idx + 1) + ' · ' + d.slice(5) + '</span>' +
        '<span class="muted">' + fmt(daySum) + ' ' + cur + '</span></h3>';
      if (!items.length) html += '<div class="muted">일정 없음</div>';
      items.forEach(function (p) {
        html += '<div class="row"><b style="min-width:112px;font-size:16px;color:var(--accent)">' + (p.start || "--:--") + (p.end ? " ~ " + p.end : "") + '</b>' +
          '<span style="flex:1">' + esc(p.place) + '</span>' +
          '<span class="muted">' + (p.amount ? fmt(p.amount) + ' ' + cur : "") + '</span>' +
          '<button class="small" data-act="del" data-list="plan" data-id="' + p.id + '">삭제</button></div>';
      });
      html += '<div class="row" style="margin-top:6px">' +
        timeWheel('pS' + idx) + '<span class="muted">~</span>' + timeWheel('pE' + idx) +
        '<input type="text" id="pP' + idx + '" placeholder="장소 / 활동" style="min-width:140px">' +
        '<input type="number" step="0.01" class="num" id="pA' + idx + '" placeholder="예상비용" style="width:100px">' +
        '<button data-act="addPlan" data-date="' + d + '" data-idx="' + idx + '">추가</button></div></div>';
    });
    return html;
  }

  function fmtTime(s) { return s ? s.replace("T", " ") : "-"; }

  function renderFlight() {

    });
    html += '<div class="card"><h2 style="margin-top:0">항공편 추가</h2>' +
      '<div class="row"><select id="fDir"><option>가는편</option><option>오는편</option></select>' +
      '<input type="text" id="fAir" placeholder="항공사 (예: 대한항공)">' +
      '<input type="text" id="fNum" placeholder="편명 (예: KE123)" style="max-width:140px"></div>' +
      '<div class="row"><input type="text" id="fDepA" placeholder="출발 공항 (예: ICN)" style="max-width:170px">' +
      '<input type="datetime-local" id="fDepT">' +
      '<input type="text" id="fArrA" placeholder="도착 공항 (예: NRT)" style="max-width:170px">' +
      '<input type="datetime-local" id="fArrT"></div>' +
      '<div class="row"><input type="text" id="fCode" placeholder="예약번호 (선택)" style="max-width:200px">' +
      '<input type="url" id="fLink" placeholder="예약 확인 페이지 링크 (선택)">' +
      '<button class="primary" data-act="addFlight">추가</button></div></div>';
    return html;
  }

  function flightForm(dir, p) {
    return '<div class="card"><h2 style="margin-top:0">' + dir + ' 등록</h2>' +
      '<div class="row"><input type="text" id="' + p + 'Air" placeholder="항공사 (예: 대한항공)">' +

  function flightCard(f) {
    return '<div class="card"><div class="row"><span class="tag">' + esc(f.direction) + '</span>' +
      '<b style="flex:1">' + esc(f.airline) + ' ' + esc(f.number) + '</b>' +
      (f.link ? '<a href="' + esc(f.link) + '" target="_blank" rel="noopener" class="tag">예약 페이지</a>' : "") +
      '<button class="small" data-act="del" data-list="flights" data-id="' + f.id + '">삭제</button></div>' +
      '<div class="row"><span style="flex:1">' + esc(f.depAirport) + ' ' + esc(fmtTime(f.depTime)) + '</span>' +
      '<span class="muted">→</span>' +
      '<span style="flex:1">' + esc(f.arrAirport) + ' ' + esc(fmtTime(f.arrTime)) + '</span></div>' +
      (f.code ? '<div class="muted">예약번호: ' + esc(f.code) + '</div>' : "") + '</div>';
  }

  function renderFlightBoth() {
    var sections = [["가는편", "g"], ["오는편", "r"]];
    var html = '';
    sections.forEach(function (s) {
      var dir = s[0], p = s[1];
      html += '<h2>' + (dir === '가는편' ? '🛫 ' : '🛬 ') + dir + '</h2>';
      var mine = state.flights.filter(function (f) { return f.direction === dir; });
      if (!mine.length) html += '<div class="muted" style="margin-bottom:8px">아직 등록된 ' + dir + '이 없습니다.</div>';
      mine.forEach(function (f) { html += flightCard(f); });
      html += flightForm(dir, p);
    });
    return html;
  }

  function renderPhoto() {
    var list = state.photos || [];
    var html = '<div class="card"><h2 style="margin-top:0">사진 올리기</h2>' +
      '<input type="file" id="photoInput" accept="image/*" multiple style="width:100%">' +
      '<div class="muted" style="margin-top:6px">사진은 자동으로 줄여서 올라갑니다. 새로고침하면 사라집니다.</div></div>';
    if (!list.length) html += '<div class="card empty"><span class="big">📷</span>아직 올린 사진이 없습니다.</div>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px">';
    list.forEach(function (src, i) {
      html += '<div style="position:relative"><img src="' + src + '" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block">' +
        '<button class="small" data-act="delPhoto" data-i="' + i + '" style="position:absolute;top:4px;right:4px;background:#fff">삭제</button></div>';
    });
    html += '</div>';
    return html;
  }

  function renderHome() {
    var html = '<div class="card"><h2 style="margin-top:0">새 여행 만들기</h2>' +
      '<div class="row"><input type="text" id="nName" placeholder="여행 이름 (예: 일본 여행)"></div>' +
      '<div class="row"><span class="muted">출발</span><input type="date" id="nDepart" value="' + todayStr() + '">' +
      '<span class="muted">귀국</span><input type="date" id="nRet" value="' + addDays(todayStr(), 2) + '"></div>' +
      '<div class="row"><button class="primary" data-act="newTrip">만들기</button></div></div>';
    if (!app.trips.length) html += '<div class="card empty"><span class="big">🧳</span>아직 만든 여행이 없습니다.<br>위에서 첫 여행을 만들어 보세요.</div>';
    app.trips.forEach(function (t, i) {
      html += '<div class="card" data-act="openTrip" data-i="' + i + '" style="cursor:pointer;border-left:6px solid ' + themeOf(t.trip.dest).a + '">' +
        '<div class="row" style="margin:0"><h3 style="flex:1">' + flagHtml(themeOf(t.trip.dest)) + ' ' + esc(t.trip.dest || "이름 없는 여행") + '</h3>' +
        '<button class="small" data-act="delTrip" data-i="' + i + '">삭제</button></div>' +
        '<div class="muted" style="margin-top:4px">' + periodOf(t) + '</div></div>';
    });
    return html;
  }

  function renderHero() {
    var hero = document.getElementById("hero");
    if (!state) {
      hero.style.background = "";
      hero.style.backgroundImage = "";
      hero.innerHTML = '<small>나의 여행</small><h1>✈️ 여행 계획 도우미</h1>';
      return;
    }
    var th = themeOf(state.trip.dest);
    hero.style.background = "linear-gradient(120deg, " + th.a + " 0%, " + th.b + " 100%)";
    if (state.photos && state.photos.length) {
      hero.style.backgroundImage = "linear-gradient(rgba(10,14,30,.35), rgba(10,14,30,.45)), url(" + state.photos[0] + ")";
      hero.style.backgroundSize = "cover";
      hero.style.backgroundPosition = "center";
    }
    hero.innerHTML = '<div class="watermark">' + th.e + '</div>' + '<svg class="hero-wave" viewBox="0 0 400 46" preserveAspectRatio="none"><path d="M0 30 Q50 10 100 30 T200 30 T300 30 T400 30 V46 H0Z" fill="rgba(255,255,255,.22)"/><path d="M0 38 Q60 22 120 38 T240 38 T360 38 T480 38 V46 H0Z" fill="rgba(255,255,255,.35)"/></svg>' + '<button data-act="home" style="background:rgba(255,255,255,.25);color:#fff;border:0;padding:4px 12px;font-size:13px;border-radius:999px;margin-bottom:8px">← 여행 목록</button>' +
      '<h1>' + flagHtml(th) + ' ' + esc(state.trip.dest || "이름 없는 여행") + '</h1><small>' + esc(periodOf(state)) + '</small>';
  }

  var renderers = { pack: renderPack, prep: renderPrep, flight: renderFlightBoth, cost: renderCost, plan: renderPlan, photo: renderPhoto };

  function applyTheme() {
    var root = document.documentElement.style;
    if (!state) {
      root.removeProperty("--accent");
      root.removeProperty("--accent-2");
      return;
    }
    var th = themeOf(state.trip.dest);
    root.setProperty("--accent", th.a);
    root.setProperty("--accent-2", th.b);
  }

  function render() {
    applyTheme();
    document.querySelector("nav").style.display = state ? "" : "none";
    renderHero();
    if (!state) {
      document.getElementById("app").innerHTML = renderHome();
      parseEmoji();
      return;
    }
    document.querySelectorAll("nav button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === state.tab);
    });
    document.getElementById("app").innerHTML = renderers[state.tab]();
    parseEmoji();
  }

  function parseEmoji() {
    if (window.twemoji) {
      window.twemoji.parse(document.getElementById("hero"), { folder: "svg", ext: ".svg" });
      window.twemoji.parse(document.getElementById("app"), { folder: "svg", ext: ".svg" });
    }
  }

  // ---------- 이벤트 (위임) ----------
  document.querySelector("nav").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]");
    if (b) { state.tab = b.getAttribute("data-tab"); render(); }
  });

  document.getElementById("app").addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    var listName = el.getAttribute("data-list");
    var itemId = el.getAttribute("data-id");

    if (act === "toggle") {
      var item = state[listName].filter(function (x) { return x.id === itemId; })[0];
      if (item) item.done = el.checked;
      if (listName === "pack") {
        var rowEl = el.closest(".row");
        var nameEl = rowEl && rowEl.querySelector("span");
        if (nameEl) nameEl.classList.toggle("done", el.checked);
        var total = state.pack.length;
        var doneN = state.pack.filter(function (x) { return x.done; }).length;
        var leftN = total - doneN;
        var pctN = total ? Math.round((doneN / total) * 100) : 0;
        var nums = document.querySelectorAll(".summary b");
        if (nums[0]) nums[0].textContent = leftN + "개";
        if (nums[1]) nums[1].textContent = doneN + "개";
        var pctText = document.querySelector(".progress");
        if (pctText) {
          var pctLabel = pctText.previousElementSibling;
          if (pctLabel) pctLabel.textContent = "진행률 " + pctN + "%";
          pctText.firstElementChild.style.width = pctN + "%";
        }
        if (pctN === 100 && !lastPackFull) confetti();
        lastPackFull = pctN === 100;
        return;
      }
      var keepY = window.scrollY;
      render();
      window.scrollTo(0, keepY);
    } else if (act === "del") {
      state[listName] = state[listName].filter(function (x) { return x.id !== itemId; });
      render();
    } else if (act === "addPack") {
      var n = document.getElementById("newPack").value.trim();
      if (!n) return;
      state.pack.push({ id: id(), name: n, essential: false, done: false });
      render();
    } else if (act === "addPrep") {
      var p = document.getElementById("newPrep").value.trim();
      if (!p) return;
      var lk = document.getElementById("newPrepLink").value.trim();
      state.prep.push({ id: id(), name: p, done: false, link: lk });
      render();
    } else if (act === "addFlight") {
      var p = el.getAttribute("data-p");
      var dirName = el.getAttribute("data-dir");
      var fNum = document.getElementById(p + "Num").value.trim();
      var fAir = document.getElementById(p + "Air").value.trim();
      if (!fNum && !fAir) return;
      state.flights.push({ id: id(), direction: dirName,
        airline: fAir, number: fNum,
        depAirport: document.getElementById(p + "DepA").value.trim(),
        depTime: document.getElementById(p + "DepT").value,
        arrAirport: document.getElementById(p + "ArrA").value.trim(),
        arrTime: document.getElementById(p + "ArrT").value,
        code: document.getElementById(p + "Code").value.trim(),
        link: document.getElementById(p + "Link").value.trim() });
      render();
    } else if (act === "addCost") {
      var cname = document.getElementById("cN").value.trim();
      var camt = parseFloat(document.getElementById("cA").value);
      if (!cname || isNaN(camt)) return;
      state.costs.push({ id: id(), name: cname, amount: camt, time: readTime("cT"),
        category: document.getElementById("cC").value,
        payer: document.getElementById("cP").value });
      render();
    } else if (act === "setNow") {
      var sp = el.getAttribute("data-p");
      var nowD = new Date();
      var hh = nowD.getHours();
      var mm = nowD.getMinutes();
      document.getElementById(sp + "H").value = (hh < 10 ? "0" : "") + hh;
      document.getElementById(sp + "M").value = (mm < 10 ? "0" : "") + mm;
    } else if (act === "openTrip") {
      state = app.trips[parseInt(el.getAttribute("data-i"), 10)];
      render();
    } else if (act === "newTrip") {
      var nm = document.getElementById("nName").value.trim() || "새 여행";
      var dp = document.getElementById("nDepart").value;
      var rt = document.getElementById("nRet").value;
      if (!dp || !rt) return;
      state = makeTrip(nm, dp, rt);
      app.trips.push(state);
      render();
    } else if (act === "delTrip") {
      app.trips.splice(parseInt(el.getAttribute("data-i"), 10), 1);
      render();
    } else if (act === "delPhoto") {
      state.photos.splice(parseInt(el.getAttribute("data-i"), 10), 1);
      render();
    } else if (act === "fillRates") {
      var pr = PRESET[state.trip.currency];
      if (!pr) return;
      state.trip.unit = pr[0];
      state.trip.rate = pr[1];
      render();
    } else if (act === "setToday") {
      var tg = el.getAttribute("data-target");
      var td = new Date();
      var ds = td.getFullYear() + "-" + String(td.getMonth() + 1).padStart(2, "0") + "-" + String(td.getDate()).padStart(2, "0");
      state.trip[tg] = ds;
      render();
    } else if (act === "addPerson") {
      var nm = document.getElementById("newPerson").value.trim();
      if (!nm) return;
      var cur = state.trip.names || [];
      if (cur.indexOf(nm) === -1) cur.push(nm);
      state.trip.names = cur;
      render();
    } else if (act === "toggleSort") {
      costSort = !costSort; render();
    } else if (act === "addPlan") {
      var idx = el.getAttribute("data-idx");
      var place = document.getElementById("pP" + idx).value.trim();
      if (!place) return;
      var a = parseFloat(document.getElementById("pA" + idx).value);
      state.plan.push({ id: id(), date: el.getAttribute("data-date"),
        start: readTime("pS" + idx),
        end: readTime("pE" + idx),
        place: place, amount: isNaN(a) ? 0 : a });
      render();
    }
  });

  document.getElementById("app").addEventListener("change", function (e) {
    var el = e.target;
    if (el.id === "photoInput") {
      var files = Array.prototype.slice.call(el.files || []);
      var pending = files.length;
      if (!pending) return;
      files.forEach(function (f) {
        readImage(f, function (d) {
          state.photos = state.photos || [];
          state.photos.push(d);
          pending -= 1;
          if (pending === 0) render();
        });
      });
      return;
    }
    if (el.id === "depart" || el.id === "ret") {
      state.trip[el.id] = el.value; render();
    } else if (el.id === "dest") {
      state.trip.dest = el.value; render();
    } else if (el.id === "currency") {
      state.trip.currency = el.value; render();
    } else if (el.id === "cC") {
      lastCat = el.value;
    } else if (el.id === "cP") {
      lastPayer = el.value;
    } else if (el.id === "rate") {
      state.trip.rate = el.value === "" ? null : parseFloat(el.value);
      render();
    } else if (el.id === "unit") {
      state.trip.unit = parseInt(el.value, 10) || 1;
      render();
    } else if (el.id === "names") {
      state.trip.names = el.value.split(",").map(function (x) { return x.trim(); }).filter(function (x) { return x; });
      if (!state.trip.names.length) state.trip.names = ["나"];
      render();
    } else if (el.id === "budget") {
      state.trip.budget = el.value === "" ? null : parseFloat(el.value);
      render();
    } else if (el.id === "people") {
      state.trip.people = Math.max(1, parseInt(el.value, 10) || 1); render();
    }
  });

  document.getElementById("hero").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act='home']");
    if (b) { state = null; render(); }
  });

  render();
})();
</script>
</body>
</html>
